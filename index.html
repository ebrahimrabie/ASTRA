<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ASTRA — Adaptive Spaceflight Tracking &amp; Risk Assessment</title>
    <meta
      name="description"
      content="Read-only decision-support prototype for astronaut health and mission risk monitoring. Not a validated clinical system."
    />
    <meta property="og:title" content="ASTRA — Adaptive Spaceflight Tracking &amp; Risk Assessment" />
    <meta
      property="og:description"
      content="Read-only decision-support prototype for astronaut health and mission risk monitoring. Not a validated clinical system."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#080F20" />
    <script>
      (function () {
        try {
          var raw = window.localStorage.getItem('astra.prefs');
          var prefs = raw ? JSON.parse(raw) : {};
          var theme = prefs.theme || 'dark';
          var lang = prefs.language === 'ar' ? 'ar' : 'en';
          var isDark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#080F20' : '#F4F7FC');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('lang', 'en');
          document.documentElement.setAttribute('dir', 'ltr');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
